[secondWind]
	#Base number of seconds a player remains downed before dying.
	# Default: 12
	# Range: 3 ~ 60
	downedTimerSeconds = 12
	#Minimum downed timer after repeated-down penalties are applied.
	# Default: 3
	# Range: 1 ~ 30
	minimumDownedTimerSeconds = 3
	#Seconds removed from the downed timer for each current penalty count.
	# Default: 2
	# Range: 0 ~ 10
	timerPenaltyPerDown = 3
	#Vanilla Slowness level applied while downed. 0 disables it, 3 is Slowness III.
	# Default: 3
	# Range: 0 ~ 6
	downedSlownessLevel = 3
	#When a downed player is hit, reduce their remaining downed timer based on the incoming damage amount.
	downedDamageReducesTimer = true
	#Minimum number of ticks between hits that can reduce a downed player's timer.
	# Default: 30
	# Range: 0 ~ 100
	downedDamageCooldownTicks = 30
	#Allow hits against downed players to continue applying normal Minecraft damage in addition to any timer reduction.
	downedDamageRegisters = false
	#Prevent healing from restoring health while the player is downed.
	blockHealingWhileDowned = true
	#Prevent downed players from eating food items until they are revived or die.
	blockEatingWhileDowned = true
	#Health restored on revive, measured in half-hearts.
	# Default: 12
	# Range: 1 ~ 40
	reviveHealthHalfHearts = 12
	#Seconds of Regeneration II granted after revive.
	# Default: 3
	# Range: 0 ~ 30
	reviveRegenerationSeconds = 3
	#Seconds of brief invulnerability granted after revive.
	# Default: 2
	# Range: 0 ~ 10
	postReviveInvulnerabilitySeconds = 3
	#How Second Wind cooldown is tracked.
	#Allowed Values: NONE, TIMED, MC_DAY, ON_SLEEP
	cooldownMode = "TIMED"
	#Timed cooldown duration in seconds when cooldownMode is TIMED.
	# Default: 300
	# Range: 0 ~ 86400
	cooldownDurationSeconds = 1200
	#Reset Second Wind cooldown and repeated-down penalty when the player dies and respawns.
	resetCooldownOnDeath = true

	[secondWind.multiplayerRevive]
		#Allow another player to revive a downed player.
		multiplayerRevive = true
		#Seconds another player must channel interaction to revive a downed player.
		# Default: 2.0
		# Range: 0.0 ~ 10.0
		reviveChannelSeconds = 2.0
		#Maximum distance between reviver and downed player during revive channel.
		# Default: 2.5
		# Range: 1.0 ~ 8.0
		reviveDistance = 2.5
		#Interrupt multiplayer revive channels when the reviver or downed player takes damage.
		reviveInterruptOnDamage = true

	[secondWind.killRules]
		#Allow passive mob kills to revive a downed player.
		allowPassiveKills = false
		#Allow player kills to revive a downed player.
		allowPlayerKills = true
		#Allow owned pet kills to count for their downed owner.
		allowPetKills = false
		#Allow Second Wind to trigger from void or out-of-world damage.
		allowVoidSecondWind = false

	[secondWind.clientFeedback]
		#Show a dark vignette while downed.
		enableDownedVignette = true
		#Show a desaturated red screen tint while downed when supported.
		enableDesaturation = true
		#Apply a soft bloom-style blur while downed when supported.
		enableDownedBloom = true
		#Play Second Wind sounds when available.
		enableSounds = true
